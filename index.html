<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nx</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/sublime.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#0d0d0d;color:#e0e0e0;height:100vh;overflow:hidden;font-size:15px;}

/* ── AUTH ── */
#auth{display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0d0d;}
.auth-inner{display:flex;flex-direction:column;align-items:center;gap:32px;width:220px;}

.underline-field{position:relative;width:100%;}
.underline-field input{
  width:100%;background:transparent;border:none;border-bottom:1px solid #333;
  padding:8px 0;color:#e0e0e0;font-family:'Roboto',sans-serif;font-size:15px;
  outline:none;text-align:center;letter-spacing:1px;
}
.underline-field input::placeholder{color:#444;font-weight:300;}
.underline-field::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:0;height:1px;background:#5fba7d;transition:width .3s ease;
}
.underline-field:focus-within::after{width:100%;}
.underline-field input.err{border-bottom-color:#e05555;}
.underline-field input.err + .err-line,
.underline-field.err-active::after{background:#e05555 !important;width:100% !important;}

.auth-btn{
  background:transparent;border:1px solid #3a7d52;color:#5fba7d;
  border-radius:3px;padding:5px 22px;font-family:'Roboto',sans-serif;
  font-size:13px;font-weight:400;cursor:pointer;letter-spacing:1px;
  transition:background .2s,color .2s;
}
.auth-btn:hover{background:#1a3a2a;color:#7dd9a0;}
.auth-link{font-size:12px;color:#3a3a3a;}
.auth-link a{color:#4a8a5a;text-decoration:none;transition:color .2s;}
.auth-link a:hover{color:#7dd9a0;}

/* ── APP ── */
#app{display:none;height:100vh;flex-direction:column;}

#topbar{
  display:flex;align-items:center;padding:0 20px;height:48px;
  background:#0d0d0d;border-bottom:1px solid #181818;gap:12px;flex-shrink:0;
}
#user-pill{
  font-size:13px;font-weight:500;letter-spacing:2px;
  color:#5fba7d;text-transform:lowercase;
  border-left:2px solid #2a6a3a;padding-left:10px;
}
#topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center;}
#lang-select{
  background:transparent;border:none;border-bottom:1px solid #282828;
  color:#666;font-family:'Roboto',sans-serif;font-size:13px;
  padding:2px 6px 2px 0;cursor:pointer;outline:none;
}
#lang-select:hover{color:#aaa;}
#lang-select option{background:#111;}
.tb-save{
  background:transparent;border:none;color:#3a6a4a;
  font-family:'Roboto',sans-serif;font-size:12px;letter-spacing:1px;
  cursor:pointer;padding:3px 0;transition:color .2s;
}
.tb-save:hover{color:#5fba7d;}
#save-indicator{font-size:11px;color:#2a4a2a;letter-spacing:1px;transition:color .6s;}
#save-indicator.saved{color:#5fba7d;}

/* ── MAIN ── */
#main{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
#sidebar{width:230px;background:#0d0d0d;border-right:1px solid #181818;display:flex;flex-direction:column;flex-shrink:0;}
#sidebar-top{padding:14px 12px 10px;display:flex;align-items:center;gap:8px;}
#sidebar-search{
  flex:1;background:transparent;border:none;border-bottom:1px solid #222;
  padding:5px 0;color:#ccc;font-family:'Roboto',sans-serif;font-size:13px;outline:none;
}
#sidebar-search::placeholder{color:#333;}
#btn-new{
  background:transparent;border:none;color:#3a6a4a;font-size:20px;
  width:24px;height:24px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:color .2s;flex-shrink:0;line-height:1;
  font-weight:300;
}
#btn-new:hover{color:#5fba7d;}

#notes-list{flex:1;overflow-y:auto;padding:4px 8px;}
#notes-list::-webkit-scrollbar{width:4px;}
#notes-list::-webkit-scrollbar-track{background:#0d0d0d;}
#notes-list::-webkit-scrollbar-thumb{background:#252525;border-radius:2px;}
#notes-list::-webkit-scrollbar-thumb:hover{background:#3a3a3a;}

.note-item{
  padding:10px 10px;border-radius:5px;cursor:pointer;
  margin-bottom:2px;transition:background .15s;user-select:none;
}
.note-item:hover{background:#141414;}
.note-item.active{background:#161616;border-left:2px solid #3a6a4a;}
.note-item.selected{background:#0f1f14;border-left:2px solid #5fba7d;}
.note-item h4{font-size:13px;font-weight:500;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-item p{font-size:12px;color:#3a3a3a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#del-sel{
  background:transparent;border:none;border-top:1px solid #1a0a0a;
  color:#6a2a2a;font-family:'Roboto',sans-serif;font-size:12px;
  padding:10px 12px;cursor:pointer;text-align:left;letter-spacing:1px;
  display:none;transition:color .2s;
}
#del-sel:hover{color:#e05555;}

/* ── EDITOR ── */
#editor-area{flex:1;display:flex;flex-direction:column;background:#0d0d0d;overflow:hidden;}
#note-title-input{
  background:transparent;border:none;border-bottom:1px solid #181818;
  padding:16px 22px;font-family:'Roboto',sans-serif;font-size:20px;
  font-weight:500;color:#fff;outline:none;flex-shrink:0;
}
#note-title-input::placeholder{color:#242424;}

#editor-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* CodeMirror */
.CodeMirror{
  height:100% !important;
  font-family:'Roboto Mono','Courier New',monospace !important;
  font-size:14px !important;line-height:1.7 !important;
  background:#0d0d0d !important;color:#abb2bf;
}
.CodeMirror-scroll{overflow-y:auto !important;}
.CodeMirror-scroll::-webkit-scrollbar{width:4px;height:4px;}
.CodeMirror-scroll::-webkit-scrollbar-track{background:#0d0d0d;}
.CodeMirror-scroll::-webkit-scrollbar-thumb{background:#252525;border-radius:2px;}
.CodeMirror-scroll::-webkit-scrollbar-thumb:hover{background:#3a3a3a;}
.CodeMirror-gutters{background:#0d0d0d !important;border-right:1px solid #181818 !important;}
.CodeMirror-linenumber{color:#2a2a2a !important;font-size:12px;}
.CodeMirror-cursor{border-left:1px solid #5fba7d !important;}
.CodeMirror-activeline-background{background:#111 !important;}
.CodeMirror-selected{background:#1e3a28 !important;}

/* inline image widget */
.cm-image-block{display:block;max-width:100%;max-height:280px;border-radius:5px;margin:6px 0;object-fit:contain;}

/* drop overlay */
#drop-overlay{
  display:none;position:absolute;inset:0;
  background:rgba(95,186,125,.05);border:1px dashed #3a6a4a;
  z-index:100;align-items:center;justify-content:center;
  font-size:13px;color:#5fba7d;letter-spacing:2px;
}
#drop-overlay.show{display:flex;}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-inner">
    <div class="underline-field" id="user-field">
      <input type="text" id="auth-user" placeholder="username" autocomplete="off" spellcheck="false">
    </div>
    <button class="auth-btn" id="auth-btn">enter</button>
    <div class="auth-link"><a href="#" id="to-register">new user</a></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div id="user-pill" id="user-pill"></div>
    <div id="topbar-right">
      <span id="save-indicator">—</span>
      <select id="lang-select">
        <option value="plain">plain</option>
        <option value="python">python</option>
        <option value="javascript">js</option>
        <option value="htmlmixed">html</option>
        <option value="text/x-c++src">c++</option>
      </select>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="sidebar-top">
        <input type="text" id="sidebar-search" placeholder="search">
        <button id="btn-new" title="new note">+</button>
      </div>
      <div id="notes-list"></div>
      <button id="del-sel">— delete selected</button>
    </div>
    <div id="editor-area">
      <input type="text" id="note-title-input" placeholder="title">
      <div id="editor-wrap">
        <div id="drop-overlay">drop image</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── STORAGE ──────────────────────────────────────────────────
const S={
  getUsers(){try{return JSON.parse(localStorage.getItem('nx_users')||'{}')}catch(e){return{}}},
  saveUsers(u){localStorage.setItem('nx_users',JSON.stringify(u))},
  getNotes(u){try{return JSON.parse(localStorage.getItem('nx_notes_'+u)||'[]')}catch(e){return[]}},
  saveNotes(u,n){localStorage.setItem('nx_notes_'+u,JSON.stringify(n))},
};

// ── STATE ─────────────────────────────────────────────────────
let currentUser=null,notes=[],activeId=null,selectedIds=new Set(),editor=null;
let autoSaveTimer=null;

// ── AUTH ──────────────────────────────────────────────────────
const authDiv=document.getElementById('auth');
const appDiv=document.getElementById('app');
const authInput=document.getElementById('auth-user');
const authBtn=document.getElementById('auth-btn');
const toReg=document.getElementById('to-register');
const userField=document.getElementById('user-field');
let isRegMode=false;

function setFieldErr(on){
  authInput.classList.toggle('err',on);
  if(on) userField.classList.add('err-active');
  else userField.classList.remove('err-active');
}
authInput.addEventListener('input',()=>setFieldErr(false));
authInput.addEventListener('keydown',e=>{if(e.key==='Enter')authBtn.click();});

authBtn.onclick=()=>{
  const u=authInput.value.trim();
  if(!u){setFieldErr(true);return;}
  const users=S.getUsers();
  if(isRegMode){
    if(users[u]){setFieldErr(true);return;}
    users[u]=1;S.saveUsers(users);
  } else {
    if(!users[u]){setFieldErr(true);return;}
  }
  loginAs(u);
};

toReg.onclick=e=>{
  e.preventDefault();
  isRegMode=!isRegMode;
  authBtn.textContent=isRegMode?'register':'enter';
  toReg.textContent=isRegMode?'sign in':'new user';
  setFieldErr(false);
};

function loginAs(u){
  currentUser=u;notes=S.getNotes(u);
  authDiv.style.display='none';appDiv.style.display='flex';
  document.getElementById('user-pill').textContent=u;
  initEditor();renderList();clearEditor();
}

// ── EDITOR INIT ───────────────────────────────────────────────
function initEditor(){
  if(editor)return;
  const wrap=document.getElementById('editor-wrap');
  const ta=document.createElement('textarea');
  wrap.appendChild(ta);
  editor=CodeMirror.fromTextArea(ta,{
    theme:'dracula',lineNumbers:true,autoCloseBrackets:true,
    matchBrackets:true,styleActiveLine:true,keyMap:'sublime',
    extraKeys:{
      'Ctrl-S':()=>saveNote(true),'Cmd-S':()=>saveNote(true),
      'Ctrl-/':cm=>cm.execCommand('toggleComment'),
      'Cmd-/':cm=>cm.execCommand('toggleComment'),
    },
    lineWrapping:true,indentUnit:4,tabSize:4,indentWithTabs:false,
  });
  editor.setSize('100%','100%');
  editor.on('change',()=>{scheduleAutoSave();scheduleImgRender();});
  setupDrop();
}

// ── AUTO-SAVE ─────────────────────────────────────────────────
const saveInd=document.getElementById('save-indicator');
function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  saveInd.classList.remove('saved');saveInd.textContent='·';
  autoSaveTimer=setTimeout(()=>saveNote(false),1200);
}
function saveNote(manual=false){
  clearTimeout(autoSaveTimer);
  if(!editor)return;
  const title=document.getElementById('note-title-input').value.trim();
  const body=editor.getValue();
  if(!title&&!body){if(manual)return;return;}
  if(activeId==null){
    const n={id:Date.now(),title:title||'untitled',body,lang:langSel.value,ts:Date.now()};
    notes.unshift(n);activeId=n.id;
  } else {
    const n=notes.find(x=>x.id===activeId);
    if(n){n.title=title||'untitled';n.body=body;n.lang=langSel.value;n.ts=Date.now();}
  }
  S.saveNotes(currentUser,notes);
  renderList(document.getElementById('sidebar-search').value);
  saveInd.textContent='saved';saveInd.classList.add('saved');
  setTimeout(()=>{saveInd.classList.remove('saved');saveInd.textContent='—';},1500);
}

document.getElementById('note-title-input').addEventListener('input',scheduleAutoSave);
document.getElementById('note-title-input').addEventListener('keydown',e=>{if(e.key==='Enter')editor&&editor.focus();});

// ── LANGUAGE ──────────────────────────────────────────────────
const langSel=document.getElementById('lang-select');
langSel.onchange=()=>{
  if(!editor)return;
  editor.setOption('mode',langSel.value==='plain'?'':langSel.value);
  if(activeId!=null){const n=notes.find(x=>x.id===activeId);if(n)n.lang=langSel.value;S.saveNotes(currentUser,notes);}
};

// ── NOTES LIST ────────────────────────────────────────────────
function renderList(filter=''){
  const list=document.getElementById('notes-list');
  list.innerHTML='';
  const f=filter.toLowerCase();
  notes.filter(n=>!f||(n.title+n.body).toLowerCase().includes(f)).forEach(n=>{
    const d=document.createElement('div');
    d.className='note-item'+(n.id===activeId?' active':'')+(selectedIds.has(n.id)?' selected':'');
    d.dataset.id=n.id;
    const preview=n.body.replace(/!\[img\]\(data:[^)]+\)/g,'[image]').replace(/\n/g,' ').slice(0,55);
    d.innerHTML=`<h4>${n.title||'untitled'}</h4><p>${preview||'empty'}</p>`;
    d.onclick=e=>{
      if(e.shiftKey){selectedIds.has(n.id)?selectedIds.delete(n.id):selectedIds.add(n.id);renderList(filter);updateDelSel();return;}
      selectedIds.clear();loadNote(n.id);
    };
    list.appendChild(d);
  });
}

function updateDelSel(){
  const btn=document.getElementById('del-sel');
  btn.style.display=selectedIds.size>0?'block':'none';
}
document.getElementById('del-sel').onclick=()=>{
  notes=notes.filter(n=>!selectedIds.has(n.id));
  selectedIds.clear();S.saveNotes(currentUser,notes);
  renderList();updateDelSel();clearEditor();
};
document.getElementById('sidebar-search').oninput=e=>renderList(e.target.value);

// ── NEW / LOAD / CLEAR ────────────────────────────────────────
document.getElementById('btn-new').onclick=()=>{
  saveNote();selectedIds.clear();clearEditor();renderList();
};

function clearEditor(){
  activeId=null;
  document.getElementById('note-title-input').value='';
  if(editor){editor.setValue('');editor.setOption('mode','');}
  langSel.value='plain';
  saveInd.textContent='—';saveInd.classList.remove('saved');
}

function loadNote(id){
  saveNote();
  const n=notes.find(x=>x.id===id);
  if(!n)return;
  activeId=id;
  document.getElementById('note-title-input').value=n.title||'';
  const lang=n.lang||'plain';
  langSel.value=lang;
  if(editor){
    editor.setOption('mode',lang==='plain'?'':lang);
    editor.setValue(n.body||'');
    setTimeout(()=>{editor.refresh();editor.scrollTo(0,0);editor.focus();},30);
  }
  renderList(document.getElementById('sidebar-search').value);
}

// ── CLICK OUTSIDE ─────────────────────────────────────────────
document.getElementById('main').addEventListener('mousedown',e=>{
  const sb=document.getElementById('sidebar');
  const ea=document.getElementById('editor-area');
  if(!sb.contains(e.target)&&!ea.contains(e.target)){saveNote();clearEditor();renderList();}
});

// ── DRAG & DROP IMAGES ────────────────────────────────────────
function setupDrop(){
  const wrap=document.getElementById('editor-wrap');
  const overlay=document.getElementById('drop-overlay');
  wrap.addEventListener('dragover',e=>{e.preventDefault();overlay.classList.add('show');});
  wrap.addEventListener('dragleave',e=>{if(!wrap.contains(e.relatedTarget))overlay.classList.remove('show');});
  wrap.addEventListener('drop',e=>{
    e.preventDefault();overlay.classList.remove('show');
    [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>{const md=`\n![img](${ev.target.result})\n`;if(editor){const c=editor.getCursor();editor.replaceRange(md,c);}};
      r.readAsDataURL(f);
    });
  });
  document.addEventListener('paste',e=>{
    [...e.clipboardData.items].filter(i=>i.type.startsWith('image/')).forEach(i=>{
      const r=new FileReader();
      r.onload=ev=>{const md=`\n![img](${ev.target.result})\n`;if(editor){const c=editor.getCursor();editor.replaceRange(md,c);}};
      r.readAsDataURL(i.getAsFile());
    });
  });
}

// ── INLINE IMAGE WIDGETS ──────────────────────────────────────
let imgTimer;
function scheduleImgRender(){clearTimeout(imgTimer);imgTimer=setTimeout(renderImageWidgets,500);}
function renderImageWidgets(){
  if(!editor)return;
  editor.getAllMarks().filter(m=>m._isImg).forEach(m=>m.clear());
  const re=/!\[img\]\((data:image\/[^)]+)\)/g;
  for(let i=0;i<editor.lineCount();i++){
    const txt=editor.getLine(i);let m;
    while((m=re.exec(txt))!==null){
      const img=document.createElement('img');
      img.src=m[1];img.className='cm-image-block';
      const w=editor.addLineWidget(i,img,{coverGutter:false,noHScroll:true});
      w._isImg=true;
    }
  }
}
setTimeout(()=>{if(editor){editor.on('change',()=>{scheduleAutoSave();scheduleImgRender();});}},300);
</script>
</body>
</html>
